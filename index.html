<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Serif+Display:ital@0;1&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="auth-root">
    <div class="auth-card" id="card">

      <!-- Форма входа -->
      <div id="login-form">
        <div class="auth-header">
          <div class="auth-logo"><i class="ti ti-shield-lock"></i></div>
          <h1 class="auth-title">С возвращением</h1>
          <p class="auth-sub">Войдите в свой аккаунт</p>
        </div>

        <div class="field" id="field-email">
          <label for="email">Эл. почта</label>
          <div class="input-wrap">
            <i class="ti ti-mail"></i>
            <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
          </div>
          <p class="error-msg" id="email-err"></p>
        </div>

        <div class="field" id="field-pass">
          <label for="password">Пароль</label>
          <div class="input-wrap has-toggle">
            <i class="ti ti-lock"></i>
            <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            <button class="toggle-pw" id="toggle-pw" type="button" aria-label="Показать пароль">
              <i class="ti ti-eye" id="eye-icon"></i>
            </button>
          </div>
          <p class="error-msg" id="pass-err"></p>
        </div>

        <p class="error-msg global-err" id="global-err"></p>

        <button class="btn-login" id="btn-submit" type="button">
          <i class="ti ti-arrow-right"></i> Войти
        </button>
      </div>

      <!-- Экран успеха -->
      <div class="success-state" id="success-state">
        <div class="success-icon"><i class="ti ti-check"></i></div>
        <strong id="success-email"></strong>
        <p>Вы успешно вошли в систему</p>
        <button class="btn-logout" id="btn-logout" type="button">Выйти</button>
      </div>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
